version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Asia/Tashkent"
    open-pull-requests-limit: 5
    groups:
      next-and-react:
        patterns:
          - "next*"
          - "react*"
          - "@types/react*"
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
      types:
        patterns:
          - "@types/*"
        exclude-patterns:
          - "@types/react*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
